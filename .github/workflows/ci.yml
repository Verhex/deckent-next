name: ci
on:
  pull_request:
  merge_group:
  push: { branches: [main] }
  workflow_dispatch:
  schedule:
    # Nightly main run: full suite plus a scheduling-weight refresh when main had no push that day.
    - cron: '23 2 * * *'
permissions:
  contents: read
concurrency:
  # Event in the group: a nightly run and a main push never cancel each other.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  prepare:
    name: prepare (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: { contents: read, actions: read }
    outputs:
      shards: ${{ steps.test_config.outputs.shards }}
      shard-count: ${{ steps.test_config.outputs.shard-count }}
      max-forks: ${{ steps.test_config.outputs.max-forks }}
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ matrix.node }}', check-latest: true, cache: npm }
      - run: node scripts/ci-temporary-environment.mjs
      - name: Read bounded test capacity from the shared configuration
        id: test_config
        run: |
          node --input-type=module -e 'import { SHARDS, MAX_FORKS } from "./scripts/ci-test-plan.mjs"; console.log(`shards=${JSON.stringify(Array.from({length: SHARDS}, (_, i) => i + 1))}\nshard-count=${SHARDS}\nmax-forks=${MAX_FORKS}`)' >> "$GITHUB_OUTPUT"
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bwrap_cache
        with:
          path: .pack/bwrap/cache
          key: bwrap-v2-${{ runner.os }}-${{ runner.arch }}-x86_64-${{ hashFiles('packaging/bwrap/bwrap.lock.json', 'packaging/bwrap/build.sh', 'scripts/build-bwrap.mjs', 'scripts/bwrap-cache.mjs') }}
      - name: Prepare locked bubblewrap
        run: |
          node scripts/build-bwrap.mjs --reuse --arch x86_64 --out "$RUNNER_TEMP/bwrap-x86_64"
          node scripts/build-bwrap.mjs --verify-cache --arch x86_64
          node scripts/build-bwrap.mjs --stage-dev "$RUNNER_TEMP/bwrap-x86_64"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.bwrap_cache.outputs.cache-hit != 'true'
        with:
          path: .pack/bwrap/cache
          key: ${{ steps.bwrap_cache.outputs.cache-primary-key }}
      # Exact-key restore only (no prefix restore-keys in this workflow): look up the newest main-scoped weights entry, else keep the committed seed.
      - name: Find the newest main-refreshed scheduling weights
        id: weights
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          key=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key ci-weights-v1- --sort created_at --order desc --limit 1 --json key --jq '.[0].key // ""')
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Scheduling weights: ${key:-committed seed}"
      - if: steps.weights.outputs.key != ''
        run: mkdir -p .pack && cp scripts/ci-test-durations.json .pack/ci-weights-seed.json
      - if: steps.weights.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/ci-test-durations.json
          key: ${{ steps.weights.outputs.key }}
          fail-on-cache-miss: true
      # The restored main weights win unless the committed seed weighs more of this tree's test files (a PR that added tests and refreshed).
      - if: steps.weights.outputs.key != ''
        run: node scripts/ci-test-weights.mjs select .pack/ci-weights-seed.json
      - run: npm run build
      - run: npm run smoke
      - name: Record complete Vitest inventory and Node-specific build
        run: |
          node node_modules/vitest/vitest.mjs list --filesOnly --json=.pack/ci-inventory.json
          node scripts/ci-build-artifact.mjs pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-node${{ matrix.node }}-${{ github.run_attempt }}
          path: .pack/ci-build.tar.gz
          if-no-files-found: error
          retention-days: 2
  lint:
    # Off the critical path: runs beside prepare, so a PR waits for max(lint, prepare) instead of their sum.
    name: lint (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ matrix.node }}', check-latest: true, cache: npm }
      - run: node scripts/ci-temporary-environment.mjs
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint:checks
  tests:
    needs: prepare
    name: tests (node ${{ matrix.node }}, shard ${{ matrix.shard }}/${{ needs.prepare.outputs.shard-count }})
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ matrix.node }}', check-latest: true, cache: npm }
      - run: node scripts/ci-temporary-environment.mjs
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-node${{ matrix.node }}-${{ github.run_attempt }}
          path: .pack/download
      - run: tar -xzf .pack/download/ci-build.tar.gz
      - name: Retain runner capacity and installed-file link evidence before preflight
        run: node scripts/ci-environment.mjs built
      - name: Prepare pinned Docker fixture and prove product sandbox
        run: |
          bash scripts/ci-docker-fixture.sh
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          export DECKENT_GLOBAL_HOME="$RUNNER_TEMP/deckent-global"
          echo "DECKENT_GLOBAL_HOME=$DECKENT_GLOBAL_HOME" >> "$GITHUB_ENV"
          node scripts/ci-shell-realm.mjs
      - name: Execute assigned tests and preserve exit
        shell: bash
        run: |
          mkdir -p .pack/ci-evidence
          set -o pipefail
          node scripts/ci-shard.mjs '${{ matrix.shard }}' 2>&1 | tee .pack/ci-evidence/verify.log
        env:
          DECKENT_TEST_STARTUP_COST: '1'
          DECKENT_TEST_TIMEOUT_MS: '30000'
          VITEST_MAX_FORKS: '${{ needs.prepare.outputs.max-forks }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shard-node${{ matrix.node }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: .pack/ci-evidence/
          if-no-files-found: error
          retention-days: 7
  weights:
    # Main push, nightly and manual runs only (owner 2026-11-02): report drift as a warning, then refresh the weights from this
    # run's receipts into the cache every later run's prepare restores. Never commits; not a required check.
    name: duration weights refresh
    if: always() && needs.prepare.result == 'success' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    needs: [prepare, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '26', check-latest: true }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shard-node*-*-${{ github.run_attempt }}
          path: .pack/shards
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-node26-${{ github.run_attempt }}
          path: .pack/download
      - name: Report drift against the weights this run used
        continue-on-error: true
        run: |
          tar -xzf .pack/download/ci-build.tar.gz scripts/ci-test-durations.json
          node scripts/ci-test-weights.mjs check .pack/shards
      # Refresh needs every file observed; a cut shard leaves the previous weights in place and the red tests job is the signal.
      - if: needs.tests.result == 'success'
        run: node scripts/ci-test-weights.mjs refresh .pack/shards
      - if: needs.tests.result == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/ci-test-durations.json
          key: ci-weights-v1-${{ github.run_id }}-${{ github.run_attempt }}

  verify:
    name: required verify (ubuntu-latest, node ${{ matrix.node }})
    if: always()
    needs: [prepare, lint, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - name: Refuse failed, cancelled or missing prerequisite jobs
        env:
          PREPARE: '${{ needs.prepare.result }}'
          LINT: '${{ needs.lint.result }}'
          TESTS: '${{ needs.tests.result }}'
        run: |
          test "$PREPARE" = success
          test "$LINT" = success
          test "$TESTS" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ matrix.node }}', check-latest: true }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-node${{ matrix.node }}-${{ github.run_attempt }}
          path: .pack/download
      - run: tar -xzf .pack/download/ci-build.tar.gz .pack/ci-inventory.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shard-node${{ matrix.node }}-*-${{ github.run_attempt }}
          path: .pack/shards
      - run: node scripts/ci-aggregate.mjs .pack/shards

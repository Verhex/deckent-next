name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # DEPS-P0 (owner 2026-09-29): support Node 24 and 26; engines.node >=24.15.0. 24 stays the primary/required
        # target until Node 26 LTS lands (2026-10-28); 26 runs here now as forward-looking, advisory proof.
        node: ['24', '26']
    # Linux + Node 24 is the required gate; every other cell (other OSes, Node 26) is advisory until their
    # native/custody proofs land (PLAN.md R1/R2) or Node 26 becomes primary.
    continue-on-error: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == '24') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run verify

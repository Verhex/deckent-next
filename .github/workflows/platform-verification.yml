name: platform verification
on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '41 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: platform verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Run 36884716187: Linux 14m05s/14m20s; bound stalled cells without increasing the budget.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # Both versions are required. Node 26 is the planned default after LTS (2026-10-28).
        node: ['24', '26']
    steps:
      - name: Preserve repository bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - name: Canonical temporary parent for every fixture runner
        id: temporary_parent
        run: node scripts/ci-temporary-environment.mjs
      - run: npm ci
        id: install
      - name: Prepare the pinned Docker test image (Linux)
        id: docker_fixture
        if: runner.os == 'Linux'
        run: bash scripts/ci-docker-fixture.sh
      - name: Restore locked bubblewrap build and APKs (Linux)
        id: bwrap_cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pack/bwrap/cache
          key: bwrap-v2-${{ runner.os }}-${{ runner.arch }}-x86_64-${{ hashFiles('packaging/bwrap/bwrap.lock.json', 'packaging/bwrap/build.sh', 'scripts/build-bwrap.mjs', 'scripts/bwrap-cache.mjs') }}
      - name: Build and stage the locked bundled bubblewrap (Linux)
        id: bubblewrap
        if: runner.os == 'Linux'
        run: |
          node scripts/build-bwrap.mjs --reuse --arch x86_64 --out "$RUNNER_TEMP/bwrap-x86_64"
          node scripts/build-bwrap.mjs --verify-cache --arch x86_64
          node scripts/build-bwrap.mjs --stage-dev "$RUNNER_TEMP/bwrap-x86_64"
          echo "DECKENT_GLOBAL_HOME=$RUNNER_TEMP/deckent-global" >> "$GITHUB_ENV"
      - name: Save verified bubblewrap build and APKs before tests (Linux)
        if: runner.os == 'Linux' && steps.bwrap_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pack/bwrap/cache
          key: ${{ steps.bwrap_cache.outputs.cache-primary-key }}
      - name: Prove the built product selects bubblewrap before tests (Linux)
        id: shell_realm
        if: runner.os == 'Linux'
        run: |
          # Only this ephemeral GitHub runner: the required mount/rename proofs need user namespaces.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          node scripts/build.mjs
          node scripts/ci-shell-realm.mjs
      - name: Verify and retain the original exit code
        id: verification
        shell: bash
        # Leaves time for summary/upload within the existing 30-minute job bound.
        timeout-minutes: 20
        run: |
          mkdir -p .pack/ci-evidence
          set -o pipefail
          npm run verify 2>&1 | tee .pack/ci-evidence/verify.log
        env:
          DECKENT_TEST_STARTUP_COST: '1'
          # Hosted macOS/Windows per-test bound (main run 37285853079: six 30-54 s completions timed out at 30 s); Linux keeps 30 s.
          DECKENT_TEST_TIMEOUT_MS: "${{ runner.os == 'Linux' && '30000' || '120000' }}"
      - name: Collect verification summary
        if: always()
        run: node scripts/ci-verification-summary.mjs
        env:
          DECKENT_CI_VERIFY_OUTCOME: '${{ steps.verification.outcome }}'
          DECKENT_CI_TEMP_OUTCOME: '${{ steps.temporary_parent.outcome }}'
          DECKENT_CI_INSTALL_OUTCOME: '${{ steps.install.outcome }}'
          DECKENT_CI_DOCKER_OUTCOME: '${{ steps.docker_fixture.outcome }}'
          DECKENT_CI_BWRAP_OUTCOME: '${{ steps.bubblewrap.outcome }}'
          DECKENT_CI_REALM_OUTCOME: '${{ steps.shell_realm.outcome }}'
      - name: Upload verification summary
        if: always()
        # Official actions/upload-artifact v7.0.1, verified 2026-10-03 (proof/CI-FIX-2026-10-03/sources.md).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verify-${{ matrix.os }}-node${{ matrix.node }}-${{ github.run_attempt }}
          path: .pack/ci-evidence/
          if-no-files-found: error
          retention-days: 7
  deps-watch:
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 3 * * 1'
    runs-on: ubuntu-latest
    # Runs npm-installed code and container builds: read-only token. Publishing is the separate deps-publish job.
    permissions:
      contents: read
    outputs:
      base-sha: ${{ steps.base.outputs.sha }}
      # Set only when refresh-bwrap exited 0 (both independent builds matched); the dependency report below may still fail the job.
      refresh-verified: ${{ steps.refresh.outputs.verified }}
      # Set only when the report shows complete signatures, no CRITICAL and no incomplete watch (ordinary advisories do not clear or block it).
      integrity-clear: ${{ steps.integrity.outputs.clear }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
        id: dependencies
      - name: Resolve drift and verify candidate pins with two independent builds
        id: refresh
        run: |
          node scripts/refresh-bwrap.mjs "$RUNNER_TEMP/deps-watch/bwrap-refresh"
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - run: node scripts/deps-watch.mjs "$RUNNER_TEMP/deps-watch"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - name: Supply-chain integrity gate for the pin PR
        id: integrity
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node scripts/deps-watch.mjs --integrity "$RUNNER_TEMP/deps-watch"
          echo "clear=true" >> "$GITHUB_OUTPUT"
      - name: Upload dependency watch reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deps-watch-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deps-watch/
          if-no-files-found: error
          retention-days: 7

  deps-publish:
    # Owner 2026-10-15: the only job with write authority. It installs no packages, builds nothing and runs no candidate code: it checks out the exact
    # base the watch resolved, re-verifies the candidate files against that base and opens a DRAFT pull request. It never merges.
    # An ordinary advisory keeps the watch job red and visible without holding back a verified pin candidate (2026-10-15 dispatch lesson);
    # a supply-chain integrity problem (signatures, CRITICAL, incomplete watch) still blocks it.
    needs: deps-watch
    if: ${{ !cancelled() && needs.deps-watch.outputs.refresh-verified == 'true' && needs.deps-watch.outputs.integrity-clear == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deps-watch.outputs.base-sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deps-watch-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deps-watch
      - name: Publish the re-verified candidate as a draft PR (never merge)
        run: node scripts/publish-bwrap-refresh.mjs "$RUNNER_TEMP/deps-watch/bwrap-refresh"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BWRAP_REFRESH_BASE: ${{ github.event.repository.default_branch }}
